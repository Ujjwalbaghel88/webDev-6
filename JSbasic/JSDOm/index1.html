<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="w-50 bg-secondary rounded-2" id="first" onclick="first()">
        Welcome To DOM
      </h1>
    </div>

    <div class="container">
      <input
        type="text"
        id="fullName"
        placeholder="Enter your Name"
        class="form-control"
      />
      <button class="bg-info" onclick="Submit()">Submit</button>
    </div>
    <br />

    <div class="container">
      <h1 class="border bg-info fs-3 rounded-3 text-center w-50" id="result">
        Clicked the button
      </h1>
      <button
        class="bg-danger w-50 border-0 rounded-2 fw-bold"
        onclick="Reset()"
      >
        Reset
      </button>
    </div>

    <div class="container divShow">
      <input
        type="text"
        id="paragraph"
        placeholder="Enter your text"
        class="form-control"
      />
      <button type="button" class="bg-success" onclick="button()">
        Button
      </button>
    </div>

    <!-- //Q7 -->

    <div class="container">
      <h1
        id="heading"
        onclick="hello()"
        class="border bg-info fs-3 rounded-3 text-center w-50"
      >
        Hello World
      </h1>
      <p id="paragraphText" onclick="para()">This is a simple paragraph.</p>
    </div>

    <!-- Q10 -->
    <div class="container">
      <button id="change" onclick="change()">button</button>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="script1.js"></script>
  </body>
</html>
