<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2</title>
  </head>
  <body>
    <h3 align="center"><b>Task 2</b></h3>

          <h2><b>Pizza Order Form</b></h2>
    <label for="firstname">First Name:</label>
    <input type="text" />
    <br />
    <br />
    <label for="lastname">Last Name:</label>
    <input type="text" />
    <br /><br />
    <label for="emailaddress">Email Address:</label>
    <input type="email" />
    <br /><br />
    <label for="contactnumber">Contact Number:</label>
    <input type="number" />
    <br /><br />
    <label for="date">Preferred Delivery Date:</label>
    <input type="date" />
    <br /><br />
    <label for="">Size:</label>
    <br />
    <input type="radio" id="size" name="radio" value="small" />
    <label for="size">Small</label>
    <input type="radio" id="medium" name="radio" value="medium" />
    <label for="medium">Medium</label>
    <input type="radio" id="large" name="radio" value="large" />
    <label for="large">Large</label>
    <br /><br />
    <label for="">Flavour:</label>
    <br />
    <input type="checkbox" />
    <label for="">Hawaiian (Php 150.00)</label>
    <select name="hawaiian" id="hawaiian">
      <option value="">1</option>
      <option value="2">2</option>
    </select>
    <br />
    <input type="checkbox" />
    <label for="pepperoni">Pepperoni (Php 140.00)</label>
    <select name="pepperoni" id="pepperoni">
      <option value="">1</option>
    </select>
    <br />
    <input type="checkbox" />
    <label for="vegetable">Vegatable (Php 130.00)</label>
    <select name="vegetable" id="vegetable">
      <option value="">1</option>
    </select>
    <br />
    <br />
    <label for="cardnum">Credit Card Number:</label>
    <input type="number" />
    <br /><br />
    <label for="pin">Pin:</label>
    <input type="password" />
    <br /><br />
    <label for="addition">Additional Note:</label>
    <br />
    <textarea name="note" id="addition"></textarea>

    <br /><br />
    <button>Submit Order</button>
    
  </body>
</html>
