<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form align="center">
        <h2>RICR FORM</h2>
    <label for="name">Name:</label>
    <input type="text" name="name" id="name" placeholder="Enter your name">
    <br><br>
    <label for="clg">College:</label>
    <input type="text"  name="clg" id="clg" placeholder="Enter your clg">
    <br><br>
    <label for="branch">Branch:</label>
    <select name="branch" name="branch" id="branch">
        <option value="">select your  branch:</option>
        <option value="cse">CSE</option>
        <option value="ai">AI</option>
        <option value="ec">EC</option>
    </select>
    <br><br>
    <label for="course">Course:</label>
    <select name="course"  name="course" id="course">
        <option value="">select course:</option>
        <option value="btech">Btech</option>
        <option value="bpharma">Bpharma</option>
    </select>
    <br><br>
    <label for="year">Year:</label>
    <select name="year" name="year" id="year">
        <option value="">select year</option>
        <option value="2nd">2rd</option>
        <option value="3rd">3rd</option>
    </select>
    <br><br>
    <label for="number">Number:</label>
    <input type="number" name="number" placeholder="enter your number">

    <br><br>
    <label for="address">Address:</label>
    <input type="text" name="address" placeholder="enter your address">
    <br><br>

    <label for="parentnum">Parent Number:</label>
    <input type="number" name="parentnum" placeholder="enter your num">
    <br><br>
    <label for="inscourse">Intrested Course:</label>
    <select name="inscourse" id="inscourse">
        <option value="">Choose your course</option>
        <option value="java">Java</option>
        <option value="python">Python</option>
    </select>
    <br><br>
    <button>Submit
        
    </button>
    </form>

</body>
</html>
