<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="">
              <main class="container">
            <div class="A1">
                <h1>Enquiry form</h1>
                 <p>Have questions or need assistance? Fill out the form below to connect with our team and <br>

            </p>
           
                    

                <div>
                    <table>
                        <tr>
                            <td>
                                <label for="">Person name*</label> <br>
                                <input type="text" class="person" placeholder=" Person name">

                            <td>
                                <label for="">Contact number*</label><br>
                                <input type="text" class="contact" placeholder=" Contact number">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="">Email*</label><br>

                            </td>
                            <td>

                        </tr>
                        <tr>

                        </tr>
                        <tr>
                            <td>
                                <label for="">Year*</label><br>
                                <select name="year" id="year">
                                    <option value="">Select Year</option>
                                    <option value="">first year</option>
                                    <option value="">second year</option>
                                    <option value="">thirsd year</option>
                                    <option value="">four year</option>
                                    <option value="">pass out</option>

                                </select>




                            </td>
                            <td>
                                <label for="">Branch</label><br>
                                <input type="text" placeholder="Branch">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                Interested in which course * <br>
                                <input type="checkbox">Full Stack Development - <br> Placement Oriented<br>
                                <input type="checkbox">
                                <label for=""> Data Science with Python -Placement <br> Oriented</label> <br>
                                <input type="checkbox">
                                <label for=""> Data Analysis with Python- <br> Placement Oriented</label><br>
                                <input type="checkbox">
                                <label for="">Business Analyst</label> <br>
                                <input type="checkbox">
                                <label for="">Java Programming</label><br>
                                <input type="checkbox">
                                <label for="">Python Programming</label><br>
                                <input type="checkbox">
                                <label for="">C/C++ Programming</label> <br>
                                <input type="checkbox">
                                <label for="">Other</label>
                            </td>

                            </td>
                            <td>

                                <label for="" class="A2">Source of Information</label>
                                <p><b>(Only choose 'Received call from <br> institute' if you actually got a call from
                                        <br>us)*</b></p>
                                <select>
                                    <option>Source of Information</option>
                                    <option>Received call from institute</option>
                                    <option>News/paper media</option>
                                    <option>Relative</option>
                                    <option>Social media</option>
                                    <option>Other</option>
                                </select>
                                <br /><br />

                                <select>
                                    <option>Name of Executive</option>
                                    <option value="1">Executive 1</option>
                                    <option value="2">Executive 2</option>
                                    <option value="3">Executive 3</option>
                                </select>

                            </td>

                        </tr>

                    </table>
                    <div class="sub">
                        <button type="submit">Submit</button>
                    </div>

            </div>
        </form>
