<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- image -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div
      class="d-flex justify-content-center align-items-center vh-100 w-100 bg-light-subtle"
    >
      <div class=" border border-1  p-5 bg-light-subtle w-25">
        <h1 class="text-center text-danger fw-bold ">
          Welcome Back
        </h1>
        <p class="text-center ">Login to your Cravings account</p>

        <div class="fw-bold">
          <span class="">
            Email <br />
            <input
              type="email"
              class="p-2 mt-2  mb-3 w-100 rounded-2"
              placeholder="Enter your email"
            />
          </span>
          Password <br />
          <input
            type="password "
            placeholder="Enter your Password "
            class="p-2 mt-2  rounded-2 w-100"
          />
        </div>

        <div
          class="p-2  d-flex justify-content-between align-items-center mb-3 w-100"
        >
          <div class="d-flex gap-2"><input type="checkbox" />Remember me</div>
          <a class="text-danger text-decoration-none" href="#"
            >Forgot Password?</a
          >
        </div>

        <div >
            <button class="btn btn-danger  w-100 ">Login</button>
        </div>

        <p class="text-center mt-2 mb-2">Dont have an account</p>

        <div class=" text-center">
            <a class="text-danger text-decoration-none" href="#">Create an account</a>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
