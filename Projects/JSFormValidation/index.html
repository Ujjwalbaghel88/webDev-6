<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <input type="text" id="fullName" placeholder="Ener your full Name" />
      <span class="error" id="nameError"></span>
    </div>
    <div>
      <input type="email" id="email" placeholder="Ener your Email" />
      <span id="emailError" class="error"></span>
    </div>
    <div>
      <input type="password" id="password" placeholder="Ener your Password" />
      <span class="error" id="passwordError"></span>
    </div>
    <div>
      <input type="number" id="number" placeholder="Ener your Number" />
      <span class="error" id="numberError"></span>
    </div>
    <button onclick="submit()">Submit</button>
    <script src="script.js"></script>
  </body>
</html>
