<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header class="bg-info bg-opacity-50 text-light p-3 text-center position-sticky">
      <h2 class="p-2  text-dark fw-bold">Weather Report🌩️🌧️🌈</h2>
    </header>

    <div class="">
      <img
        src="./image.png"
        class="w-100 position-fixed min-vh-100 position-absolute"
      />

      <div class="d-flex justify-content-center p-5  position-relative">
        <div>
          <img
            src="https://media.istockphoto.com/id/1323823418/photo/low-angle-view-thermometer-on-blue-sky-with-sun-shining.jpg?s=612x612&w=0&k=20&c=LwLCGF902C-DNwKgCMCR12zFnB4g1INWzlk1JPOidRk="
            class="w-50"
            alt="weatherImage"
          />
        </div>
        <div class="d-grid p-2 border border-3 rounded-3 border-info gap-3">
          <div class="d-flex p-2">
            <label class="p-2 fs-4 fw-bold">City Name:</label>

            <input type="text" id="cityName" class="form-control w-50" />
          </div>

          <div
            class="bg-info   bg-opacity-25 rounded-2 d-flex align-items-center"
          >
            <i class="bi bi-droplet-fill fs-1 me-3 text-info"></i>
            <div>
              <h5 class="mt-0">Humidity</h5>
              <p class="fs-4 mb-0" id="Humidity">--</p>
            </div>
          </div>

          <div
            class="bg-info bg-opacity-25 rounded-3 d-flex align-items-center"
          >
            <i class="bi bi-wind fs-1 me-3 text-secondary"></i>
            <div>
              <h5 class="mt-0">Wind</h5>
              <p class="fs-4 mb-0" id="Wind">--</p>
            </div>
          </div>

          <div class="p-2 d-grid">
            <button class="btn btn-info p-2" onclick="getWeather()">
              Get Weather
            </button>
            <label class=" text-center fs-5 p-2 fw-bold"
              >Temp : <span id="Temperature">30</span>ºC🌤️</label
            >
          </div>
        </div>
      </div>
    </div>

    <br />

    <!-- Scripts -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
