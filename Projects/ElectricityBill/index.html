<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Electricity Bill Calculator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div
      class="vh-100 d-flex justify-content-center align-items-center bg-light"
    >
      <div class="border-0 rounded-4 p-4 bg-success-subtle">
        <h1 class="text-center fw-bold p-2 w-100 mb-3 text-success">
          Electricity Bill Calculator
        </h1>

        <p class="text-center text-success">
          Calculate your electricity bill easily
        </p>

        <div class="mb-4">
          <label class="form-label fw-semibold">
            Enter Electricity Units
          </label>

          <input
            type="number"
            id="units"
            class="form-control form-control-lg rounded-4"
            placeholder="Enter units"
          />
        </div>

        <button
          class="btn btn-warning p-2 fs-4 text-light rounded-4 fw-bold w-100"
          onclick="calculateBill()"
        >
          Calculate Bill
        </button>

        <div
          id="result"
          class="alert alert-light rounded-4 mt-4 text-center fw-bold d-none"
        ></div>

        <div class="mt-4">
          <h5 class="fw-bold mb-3">Bill Rate</h5>

          <ul class="list-group rounded-4">
            <li class="list-group-item">0 - 100 Units → ₹5 / unit</li>

            <li class="list-group-item">101 - 300 Units → ₹7 / unit</li>

            <li class="list-group-item">301+ Units → ₹10 / unit</li>
          </ul>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
