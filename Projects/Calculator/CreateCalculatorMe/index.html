<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalculatorCreME</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class=" d-flex justify-content-center align-items-center"
      id="calculatorBG"
    >
      <div class="border border-5 p-lg-3 rounded-5 bg-light">
       

         <div
          class="bg-success-subtle rounded-top-5 p-3 mb-1 border border-dark d-flex justify-content-end align-items-center"
          id="dispaly"
        >
          <label for="Text" class="fs-2 p-lg-4 text-end" id="text"
            >0</label
          >
        </div>
        <div
          class="w-100 p-3 bg-danger-subtle d-grid border border-dark rounded-bottom-4"
        >
          <div class="row p-2 d-flex justify-content-evenly ">
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"    onclick="Calculate('AC')">Ac</button>
           
            </div>
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0" onclick="Calculate('C')">C</button>
            </div>
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0" onclick="Calculate('%')">%</button>
            </div>
            <div class="col-3">
              <button class="bg-warning rounded-circle px-4 py-3 border-0"  onclick="Calculate('/')">
                /
              </button>
            </div>
          </div>

          <div class="row p-2 d-flex justify-content-evenly ">
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"   onclick="Calculate('7')">7</button>
            </div>
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"  onclick="Calculate('8')">8</button>
            </div>
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"   onclick="Calculate('9')">9</button>
            </div>
            <div class="col-3">
              <button class="bg-warning rounded-circle px-4 py-3 border-0"   onclick="Calculate('*')">
                *
              </button>
            </div>
          </div>


          <div class="row p-2 d-flex justify-content-evenly">
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"   onclick="Calculate('4')">4</button>
            </div>
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"   onclick="Calculate('5')">5</button>
            </div>
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"   onclick="Calculate('6')">6</button>
            </div>
            <div class="col-3">
              <button class="bg-warning rounded-circle px-4 py-3 border-0"   onclick="Calculate('-')">
                -
              </button>
            </div>
          </div>

          <div class="row p-2  d-flex justify-content-evenly">
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"  onclick="Calculate('1')">1</button>
            </div>
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"  onclick="Calculate('2')">2</button>
            </div>
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"  onclick="Calculate('3')">3</button>
            </div>
            <div class="col-3">
              <button class="bg-warning rounded-circle px-4 py-3 border-0"   onclick="Calculate('+')">
                +
              </button>
            </div>
          </div>

          <div class="row p-2 d-flex justify-content-evenly">
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"  onclick="Calculate('0')">0</button>
            </div>
            <div class="col-3">
              <button class="rounded-circle px-4 py-3 border-0"  onclick="Calculate('.')">.</button>
            </div>

            <div class="col-6">
              <button class="rounded-5 p-3 px-5 bg-success text-light border-0"   onclick="Calculate('=')">
                =
              </button>
            </div>
          </div>


        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
