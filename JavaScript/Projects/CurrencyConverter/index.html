<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Currency Converter</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  />

  <style>
    body {
      background-color: #18c4e7;
      min-height: 100vh;
    }

    .main-heading {
      background-color: orange;
      padding: 15px;
      text-align: center;
      font-size: 50px;
      font-weight: bold;
    }

    .flag-img {
      width: 120px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid white;
    }

    .converter-box {
      margin-top: 50px;
    }

    .swap-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 25px;
    }

    #result {
      font-size: 35px;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .main-heading {
        font-size: 30px;
      }

      .flag-img {
        width: 90px;
        height: 60px;
      }
    }
  </style>
</head>

<body>

  <h1 class="main-heading">Currency Converter</h1>

  <div class="container converter-box">

    <div class="row align-items-center g-4">

      <!-- FROM -->
      <div class="col-md-5">

        <div class="text-center mb-3">
          <img
            src="https://flagsapi.com/US/flat/64.png"
            id="flag1"
            class="flag-img"
          />
        </div>

        <select class="form-select form-select-lg" id="country1">
        </select>

      </div>

      <!-- SWAP -->
      <div class="col-md-2 text-center">

        <button class="btn btn-dark swap-btn" id="swapBtn">
          <i class="bi bi-arrow-left-right"></i>
        </button>

      </div>

      <!-- TO -->
      <div class="col-md-5">

        <div class="text-center mb-3">
          <img
            src="https://flagsapi.com/IN/flat/64.png"
            id="flag2"
            class="flag-img"
          />
        </div>

        <select class="form-select form-select-lg" id="country2">
        </select>

      </div>

    </div>

    <!-- Amount -->
    <div class="row mt-5">
      <div class="col-md-6 mx-auto">

        <input
          type="number"
          placeholder="Enter Amount"
          class="form-control form-control-lg"
          id="orgAmount"
        />

        <p class="error mt-2" id="error"></p>

      </div>
    </div>

    <!-- Button -->
    <div class="row mt-4">
      <div class="col-md-4 mx-auto d-grid">

        <button class="btn btn-primary btn-lg" id="convertBtn">
          Convert
        </button>

      </div>
    </div>

    <!-- Loading -->
    <div class="text-center mt-3">
      <p id="loading"></p>
    </div>

    <!-- Result -->
    <div class="text-center mt-4">
      <h2 id="result">Converted Amount :</h2>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
