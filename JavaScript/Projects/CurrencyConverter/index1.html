<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Currency Converter</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADING -->

    <h1 class="main-heading">Currency Converter</h1>

    <div class="container mt-5">
      <div class="row align-items-center">
        <!-- FROM COUNTRY -->

        <div class="col-md-5 text-center">
          <img src="" id="flag1" class="flag-img mb-3" />

          <select class="form-select form-select-lg" id="country1">
            <option value="">Select Country</option>
          </select>
        </div>

     

       

        <!-- TO COUNTRY -->

        <div class="col-md-5 text-center">
          <img src="" id="flag2" class="flag-img mb-3" />

          <select class="form-select form-select-lg" id="country2">
            <option value="">Select Country</option>
          </select>
        </div>
      </div>

      <!-- AMOUNT INPUT -->

      <div class="row mt-5">
        <div class="col-md-6 mx-auto">
          <input
            type="number"
            id="orgAmount"
            class="form-control form-control-lg"
            placeholder="Enter Amount"
          />
        </div>
      </div>

      <!-- ERROR MESSAGE -->

      <div class="row mt-3">
        <div class="col-md-6 mx-auto">
          <p id="errorMessage"></p>
        </div>
      </div>

      <!-- CONVERT BUTTON -->

      <div class="row mt-4">
        <div class="col-md-4 mx-auto d-grid">
          <button
            class="btn btn-primary btn-lg"
            id="convertBtn"
            onclick="convertCurrency()"
          >
            Converted Amount:
          </button>
        </div>
      </div>

      <!-- RESULT -->

      <div class="text-center mt-5">
        <h1 id="newAmount"></h1>

        <p id="exchangeRate"></p>
      </div>
    </div>

    <!-- SCRIPT -->

    <script src="script1.js"></script>
  </body>
</html>
