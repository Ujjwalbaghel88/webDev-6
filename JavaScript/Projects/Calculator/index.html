<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="position-relative d-flex justify-content-center align-items-center"
    >
      <img src="./image.png " class="w-100 vh-100" alt="bgImage" />
      <div class="position-absolute border border-5 p-lg-3 rounded-5 bg-light">
        <!-- <div class="position-absolute vh-100"> -->
        <div class="w-100 pb-2">
          <input
            type="text"
            value="0"
            class="w-100 bg-success-subtle p-5 border border-dark rounded-top-4 text-end"
          />
        </div>
        <div class="w-100 p-3 bg-danger-subtle border border-dark rounded-bottom-4">
          <div class="row  ">
            
           
            
          
          <div class="col-3" >
              <button class="rounded-circle  px-4 py-3">Ac</button>
          </div>
           <div class="col-3" >
              <button class="rounded-circle  px-4 py-3">C</button>
          </div>
           <div class="col-3" >
             <button class="rounded-circle  px-4 py-3">%</button>
          </div>
           <div class="col-3" >
               <button class="bg-warning rounded-circle  px-4 py-3">/</button>
          </div>
          </div>
          <div class="row p-3">
            <button class="rounded-5 p-3 col-3">7</button>
            <button class="rounded-5 p-3 col-3">8</button>
            <button class="rounded-5 p-3 col-3">9</button>
            <button class="bg-warning rounded-5 p-3 col-3">*</button>
          </div>
          <div class="row p-3">
            <button class="rounded-5 p-3 col-3">4</button>
            <button class="rounded-5 p-3 col-3">5</button>
            <button class="rounded-5 p-3 col-3">6</button>
            <button class="bg-warning rounded-5 p-3 col-3">-</button>
          </div>
          <div class="row p-3">
            <button class="rounded-5 p-3 col-3">1</button>
            <button class="rounded-5 p-3 col-3">2</button>
            <button class="rounded-5 p-3 col-3">3</button>
            <button class="bg-warning rounded-5 p-3 col-3">+</button>
          </div>

          <div class="row p-3 ">
            <button class="rounded-5 p-3 col-3">0</button>
            <button class="rounded-5 p-3 col-3">.</button>
          
            <button class="rounded-5 p-3 col-6 bg-success">=</button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
