<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
</head>
<body>



<div class="container bg-info w-25 mt-4 p-4 rounded-5">

    <div class="bg-info p-3 w-100 "   >   
    <h4 class="bg-danger w-100   text-center text-light rounded-2 p-2 mt-2">TIP CALCULATOR</h2>
    <form id="TipForm" class=" border  d-grid bg-light p-3 w-100 rounded-2">
        <label ">Bill Amount</label> <br>
    <div class="input-group mb-4">
        <span><input id="billAmount" class="form-control border-0 border-bottom  w-100 rounded-0  " type="number" placeholder="Amount to be paid"></span>
         <i class="bi bi-currency-rupee"></i>
     
    </div>
    <label for="">How was the service ?</label><br>
    <select class="w-75 border-0 border-bottom bg-transparent" name="tip" id="tip">
        <option value="">Select:</option>
        <option value="">25% - Top Notch</option>
        <option value="">20% - Excellent</option>
        <option value="">15% - Good</option>
        <option value="">10% - Bad</option>
        <option value="">5% - Worst</option>
    </select> <br>
    <label for="">Total number of persons</label> <br>
    <input type="text" class="w-100 border-0 border-bottom bg-transparent" placeholder="Number of People sharing the bill"><br> <br>
    <button type="submit" class="bg-info  btn ms-5 w-50  text-light p-2  rounded-1 border-0">Calculate</button>
    </form>
    </div>
</div>

 <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
</body>
</html>
