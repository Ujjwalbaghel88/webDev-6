<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header>
      <h2 class="bg-primary-subtle mb-0 p-2 text-center fw-bold">
        Weather Report🌩️🌧️🌈
      </h2>
    </header>

    <div>
      <img src="./image.png" class="w-100 min-vh-100 position-fixed" />

      <div class="d-flex justify-content-center p-lg-5 position-relative">
        <div
          class="bg-dark-subtle p-3 d-grid p-2 border border-3 rounded-3 border-info"
        >
          <div class="d-grid p-2">
            <label class="w-100 p-5 fs-4 fw-bold">
              City Temp : <span id="Temperature">30</span>ºC🌤️</label
            >

            <!-- <div class="d-flex p-2">
              <label class="p-2 fw-bold">Another City:</label>

              <input
                type="text"
                id="cityName"
                class="form-control w-50 bg-light border-black"
              />
            </div> -->

            <!-- Wind and Humidity -->

            <div class="p-3 d-grid gap-3">
              <div
                class="bg-white bg-opacity-25 rounded-3 p- d-flex align-items-center"
              >
                <i class="bi bi-droplet-fill fs-1 me-3 text-info"></i>
                <div>
                  <h5 class="mt-0">Humidity</h5>
                  <p class="fs-4 mb-0" id="Humidity">--</p>
                </div>
              </div>

              <div
                class="bg-white bg-opacity-25 rounded-3 d-flex align-items-center"
              >
                <i class="bi bi-wind fs-1 me-3 text-secondary"></i>
                <div>
                  <h5 class="mt-0">Wind</h5>
                  <p class="fs-4 mb-0" id="Wind">--</p>
                </div>
              </div>
            </div>

            <button class="btn btn-info p-2" onclick="getWeather()">
              Get Weather
            </button>
          </div>
        </div>
      </div>
    </div>

    <br />

    <!-- Scripts -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
