<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-primary-subtle" >
    <header class="bg-primary text-light p-3 text-center position-sticky ">
      <h2 class="fw-bold">Weather Report🌩️🌧️🌈</h2>
    </header>
      
       

    <div class="">
         <img src="./image.png" class="w-100 position-fixed min-vh-100 position-absolute">


        
    <div class="d-flex justify-content-center p-lg-5 position-relative">
    
      <div>
        <img
          src="https://media.istockphoto.com/id/1323823418/photo/low-angle-view-thermometer-on-blue-sky-with-sun-shining.jpg?s=612x612&w=0&k=20&c=LwLCGF902C-DNwKgCMCR12zFnB4g1INWzlk1JPOidRk="
          class=" w-50"
          alt="weatherImage"
        />
      </div>
      <div class="d-grid p-2 border border-3  rounded-3 border-info">
        <div class="d-flex p-2">
          <label class="p-2 fw-bold">City Name:</label>

          <input type="text" id="cityName" class="form-control w-50 h-50" />
        </div>

        <div class="p-2">
          <button class="btn btn-info p-2" onclick="getWeather()">
            Get Weather
          </button>
          <label class="w-50 p-2 fw-bold"
            >Temp : <span id="Temperature">30</span>ºC🌤️</label
          >
        </div>
      </div>
    </div>
       </div>

    <br />

    <!-- Scripts -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
